version: '3.8'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: icd2026-backend
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/database.sqlite:/app/database.sqlite
